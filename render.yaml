services:
  # Backend Service
  - type: web
    name: cafe-bosque-api
    env: node
    repo: https://github.com/MarcosEscandon/cafe-menu-app.git
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /api/health
    autoDeploy: true
